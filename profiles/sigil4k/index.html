            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }
        .link-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.02);
